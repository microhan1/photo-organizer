[pytest]
testpaths = tests
# pytest's default fd-level capture swaps file descriptors 0-2 under Tk; on Windows a
# new Tk() then intermittently failed to read tk.tcl ("Can't find a usable tk.tcl",
# scan-pdf-split). Capturing at the sys level leaves the descriptors alone.
addopts = --capture=sys -p no:cacheprovider
